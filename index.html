<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="B-67XL AmazingView Online: an emulator of the TI-30XS MultiView scientific calculator, with the MathPrint display, fractions, statistics and tables." />
    <title>B-67XL AmazingView Online</title>
    <script>
      // Apply a saved page theme before first paint (src/ui/useTheme.ts).
      try {
        var t = localStorage.getItem("ti30xs:theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
